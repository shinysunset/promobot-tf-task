# Пример файла конфигурации статических трансформаций
# Координаты в метрах, углы в радианах

static_transforms:
  # Связь между глобальной системой 'world' и системой карты 'map'
  # Например, начало карты смещено относительно мира
  - parent_frame: "world"
    child_frame: "map"
    translation:
      x: 0.5
      y: 1.0
      z: 0.0
    # Используем кватернион для поворота 'map' относительно 'world' на 90 градусов вокруг Z
    rotation_quat:
      x: 0.0
      y: 0.0
      z: 0.7071068 # sin(90/2)
      w: 0.7071068 # cos(90/2)

  # Связь между системой карты 'map' и системой одометрии 'odom'
  # Часто совпадает, но может отличаться
  - parent_frame: "map"
    child_frame: "odom"
    translation: {x: 0, y: 0, z: 0}
    rotation_rpy: {roll: 0, pitch: 0, yaw: 0} # Без смещения и поворота

  # Связь между системой одометрии 'odom' и базой робота 'base_link'
  # Эта трансформация обычно публикуется динамически узлом одометрии,
  # но для примера сделаем ее статической.
  - parent_frame: "odom"
    child_frame: "base_link"
    translation:
      x: 2.0 # Робот находится в точке (2, 3) системы odom
      y: 3.0
      z: 0.1 # База чуть приподнята над землей
    # Используем RPY для поворота базы робота на -45 градусов вокруг Z
    rotation_rpy:
      roll: 0.0
      pitch: 0.0
      yaw: -0.785398 # -45 градусов в радианах

  # Связь базы робота 'base_link' и лидара 'lidar_link'
  - parent_frame: "base_link"
    child_frame: "lidar_link"
    translation:
      x: 0.15 # Лидар на 15 см спереди от центра базы
      y: 0.0  # По центру оси Y базы
      z: 0.25 # На 25 см выше центра базы
    # Лидар не повернут относительно базы
    rotation_quat: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}


